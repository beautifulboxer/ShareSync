<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShareSync - Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main  class="login-page">
        <div class="login-box">
            <div class="logo">
                <span class="ribbon-mark" aria-hidden="true"></span>
            </div>


            <h1>Admin Login</h1>
            <p class="welcome">
                Sign in to manage ShareSync
            </p>
            
            <form id ="adminLoginForm">
                <div class="input-group floating-group">
                    <input 
                        type="email"
                        id="adminEmail"
                        placeholder=" "
                        required
                    >
                    <label for="adminEmail">
                        Admin Email
                    </label>
                </div>


                <div class="input-group password-group floating-group">
                    <input 
                        type="password"
                        id="adminPassword"
                        placeholder=" "
                        required
                    >
                    <label for="adminPassword">
                        Password
                    </label>

                    <button
                        type="button"
                        class="password-toggle"
                        id="adminPasswordToggle"
                        aria-label="Show password"
                        title="Show password"
                        >
                           &#128065;
                    </button>       
                </div>

                <button type="submit" class="login-btn">
                    Admin Sign In
                </button>
            </form>
        </div>
    </main>

        <footer class="footer">
        <p>ShareSync · Admin Panel</p>
    </footer>
<script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>

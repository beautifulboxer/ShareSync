<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device,initial-scale=1.0">

    <title>ShareSync - Admin Login</title>
    <link rel="stylesheet" herf="style.css">
</head>

<body>
    <main class="login-page">
        <div class="login-box">
            <div class="logo">
                <span class="ribbon-mark"aria-hidden="true"></span>
            </div>


            <h1>Admin Login</h1>
            <p class="welcome">
                Sign in to manage ShareSync
            </p>
            
            <form id ="adminLoginForm">
                <div class="input-group floating-group">
                    <input 
                        type="email"
                        id="adminEmail"
                        placeholder=" "
                        required
                    >
                    <lable for="adminEmail">
                        Admin Email
                    </lable>
                </div>


                <div class="input-group password-group floating-group">
                    <input 
                        type="password"
                        id="adminPassword"
                        placeholder=" "
                        required
                    >
                    <lable for ="adminPassword">
                        Password
                    </lable>

                    <button
                        type="button"
                        class="password-toggle"
                        id="adminPasswordToggle"
                        aria-lable="Show password"
                        title="Show password"
                        >
                           &#128065;
                    </button>       
                    </div>

                    <button type="submit" class="login-btn">
                    Admin Sign In
                </button>
                
            </form>
        </div>

    </main>
</body>
